name: Build iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build App
        run: |
          cd ClaudeVision
          xcodegen generate
          xcodebuild -project ClaudeVision.xcodeproj -scheme ClaudeVision -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          mv build/Release-iphoneos/ClaudeVision.app Payload/
          zip -r VisionClaude.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaude-IPA
          path: ClaudeVision/VisionClaude.ipa
